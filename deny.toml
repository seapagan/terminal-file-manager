[advisories]
version = 2
# Maintainer-approved exception for chrono's unmaintained notice only; no
# patched version exists. Remove after replacing Linux-only chrono (TODO.md).
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Preserve Linux Trash local timestamps pending the replacement investigation in TODO.md." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

# notify's Windows backend remains in Cargo's all-target resolution, even though
# TFM only enables notify on Linux/macOS. The Windows target graph excludes it.
# Remove when notify's resolved backend adopts the shared bindings version.
[[bans.skip]]
name = "windows-sys"
version = "=0.60.2"

# Crossterm/strum still use syn 2 while Ratatui's other macros use syn 3.
# Remove when those upstream macro dependencies converge.
[[bans.skip]]
name = "syn"
version = "=2.0.119"

# Crossterm's level-triggered Unix input uses filedescriptor -> thiserror 1;
# Ratatui/kasuari require thiserror 2. Remove when filedescriptor adopts 2.
[[bans.skip]]
name = "thiserror"
version = "=1.0.69"

[[bans.skip]]
name = "thiserror-impl"
version = "=1.0.69"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
