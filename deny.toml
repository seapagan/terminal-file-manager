[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Zlib", "Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
