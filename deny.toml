[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "CC0-1.0", "ISC"]

# Ratatui's hashbrown dependency; reassess when its hashing backend changes.
[[licenses.exceptions]]
name = "foldhash"
version = "=0.2.0"
allow = ["Zlib"]

# Proc-macro identifier tables; retain the upstream Unicode notice.
[[licenses.exceptions]]
name = "unicode-ident"
version = "=1.0.27"
allow = ["Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"

# notify 8.2 uses 0.60; the application and its other dependencies use 0.61.
# Remove when stable notify adopts the shared Windows bindings version.
[[bans.skip]]
name = "windows-sys"
version = "=0.60.2"

# Crossterm/strum still use syn 2 while Ratatui's other macros use syn 3.
# Remove when those upstream macro dependencies converge.
[[bans.skip]]
name = "syn"
version = "=2.0.119"

# Crossterm's level-triggered Unix input uses filedescriptor -> thiserror 1;
# Ratatui/kasuari require thiserror 2. Remove when filedescriptor adopts 2.
[[bans.skip]]
name = "thiserror"
version = "=1.0.69"

[[bans.skip]]
name = "thiserror-impl"
version = "=1.0.69"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
