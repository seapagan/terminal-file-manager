name: Python support CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  support:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.14.8']
        include:
          - os: ubuntu-24.04
            python: '3.10.21'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python for support tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python support tools
        run: |
          python -m pip install 'ruff==0.17.0' 'mypy==2.4.0' 'lizard==1.23.0'
          ruff --version
          mypy --version
          lizard --version
      - name: Verify Python support code and actual scanner
        run: |
          ruff format --check .
          ruff check .
          mypy --strict --python-version 3.10 --exclude-gitignore .
          python -B -m unittest discover -s tests -p 'test_*.py'
          COMPLEXITY_LIZARD_VERSION=1.23.0 \
          COMPLEXITY_MAX_CCN=10 \
          COMPLEXITY_MAX_FUNCTION_NLOC=50 \
          COMPLEXITY_MAX_PARAMETERS=8 \
          COMPLEXITY_MAX_FILE_NLOC=500 \
          python scripts/check_complexity.py
