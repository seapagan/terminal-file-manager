name: Release rehearsal

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  RUST_VERSION: 1.99.0
  RUSTUP_VERSION: 1.29.1

jobs:
  prepare:
    name: Prepare release context
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      crate-version: ${{ steps.version.outputs.crate-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Linux Rustup bootstrap verification
        run: bash tests/ci/rustup-bootstrap.sh

      - name: Test exact release asset inventory
        run: bash tests/ci/release-inventory.sh

      - name: Install Rust toolchain
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Resolve and validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          crate_version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "terminal-file-manager") | .version')
          release_tag="v$crate_version"
          if [ "$EVENT_NAME" = push ]; then
            if [ "$REF_NAME" != "$release_tag" ]; then
              echo "error: release tag $REF_NAME does not match Cargo version $crate_version" >&2
              exit 1
            fi
            release_tag=$REF_NAME
          fi
          echo "crate-version=$crate_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      ARCHIVE_NAME: terminal-file-manager-${{ needs.prepare.outputs.release-tag }}-${{ matrix.target }}.${{ matrix.extension }}
      BUILD_IMAGE: ${{ matrix.image }}
      CRATE_VERSION: ${{ needs.prepare.outputs.crate-version }}
      TARGET: ${{ matrix.target }}
      RUSTUP_INIT_SHA256: ${{ matrix.rustup_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            rustup_sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
            runner: ubuntu-24.04
            # quay.io/pypa/manylinux_2_28_x86_64:latest, resolved 2026-09-26.
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
            kind: linux
            libc: gnu
            arch: x86_64
            extension: tar.gz
          - target: x86_64-unknown-linux-musl
            rustup_sha256: 331228566cc931f32cd684f9bebc5956a5e5d7394c8d5de595f196a658ab98e6
            runner: ubuntu-24.04
            # quay.io/pypa/musllinux_1_2_x86_64:latest, resolved 2026-09-26.
            image: quay.io/pypa/musllinux_1_2_x86_64@sha256:bcd644f5f08de4c286b4e8a99652d106a7e56881d8e0b3f92d471f05f5b60fd3
            kind: linux
            libc: musl
            arch: x86_64
            extension: tar.gz
          - target: aarch64-unknown-linux-gnu
            rustup_sha256: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
            runner: ubuntu-24.04-arm
            # quay.io/pypa/manylinux_2_28_aarch64:latest, resolved 2026-09-26.
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:c22ffd129ac99a8a42d1f2c2f4e88a9089288dd9ee987a7092da1c7dc48f27a9
            kind: linux
            libc: gnu
            arch: aarch64
            extension: tar.gz
          - target: aarch64-unknown-linux-musl
            rustup_sha256: 1ddf36182ac5d1782dbeefcb9bea7f5f9412d88f4a0d5047b1564a223624e8c6
            runner: ubuntu-24.04-arm
            # quay.io/pypa/musllinux_1_2_aarch64:latest, resolved 2026-09-26.
            image: quay.io/pypa/musllinux_1_2_aarch64@sha256:fecc36f309839b485f04e36b6fd2272d98b84936e68122f3de9bd65c253e76dc
            kind: linux
            libc: musl
            arch: aarch64
            extension: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            kind: macos
            arch: x86_64
            # `file` spells the architectures differently per platform.
            macho_arch: x86_64
            extension: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-26
            kind: macos
            arch: aarch64
            macho_arch: arm64
            extension: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            kind: windows
            arch: x86_64
            extension: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            kind: windows
            arch: aarch64
            extension: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ----- Linux: controlled-libc container builds ---------------------

      - name: Build in controlled libc container
        if: matrix.kind == 'linux'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env RUST_VERSION \
            --env RUSTUP_VERSION \
            --env RUSTUP_INIT_SHA256 \
            --env TARGET \
            "$BUILD_IMAGE" \
            /bin/bash -ceu '
              export CARGO_HOME=/tmp/tfm-cargo
              export RUSTUP_HOME=/tmp/tfm-rustup
              rustup_init=/tmp/tfm-bootstrap/rustup-init
              mkdir -p /tmp/tfm-bootstrap
              curl --proto "=https" --tlsv1.2 -sSf \
                --output "$rustup_init" \
                "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$TARGET/rustup-init"
              printf "%s  %s\n" "$RUSTUP_INIT_SHA256" "$rustup_init" | sha256sum --check -
              chmod 755 "$rustup_init"
              "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain "$RUST_VERSION"
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup target add "$TARGET"
              cargo build --release --locked --target "$TARGET"
            '

      - name: Verify unstripped ELF compatibility
        if: matrix.kind == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
          LIBC: ${{ matrix.libc }}
        run: scripts/verify-release-binary.sh "$LIBC" "$ARCH" "target/$TARGET/release/tfm"

      - name: Strip release binary (Linux)
        if: matrix.kind == 'linux'
        run: |
          binary="target/$TARGET/release/tfm"
          stat --format='size before stripping: %s bytes' "$binary"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$BUILD_IMAGE" \
            strip --strip-all "$binary"
          stat --format='size after stripping: %s bytes' "$binary"

      - name: Verify stripped ELF compatibility
        if: matrix.kind == 'linux' && matrix.libc == 'gnu'
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/verify-release-binary.sh gnu "$ARCH" "target/$TARGET/release/tfm"

      - name: Verify stripped static ELF
        if: matrix.kind == 'linux' && matrix.libc == 'musl'
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/verify-release-binary.sh static "$ARCH" "target/$TARGET/release/tfm"

      # ----- macOS: native runner builds ----------------------------------

      - name: Install Rust toolchain (macOS)
        if: matrix.kind == 'macos'
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build release binary (macOS)
        if: matrix.kind == 'macos'
        run: cargo build --release --locked --target "$TARGET"

      - name: Verify Mach-O architecture
        if: matrix.kind == 'macos'
        env:
          EXPECTED_ARCH: ${{ matrix.macho_arch }}
        run: |
          description=$(file "target/$TARGET/release/tfm")
          echo "$description"
          grep -Eq "Mach-O 64-bit executable $EXPECTED_ARCH" <<<"$description" || {
            echo "error: expected a $EXPECTED_ARCH Mach-O executable" >&2
            exit 1
          }

      - name: Strip release binary (macOS)
        if: matrix.kind == 'macos'
        run: |
          binary="target/$TARGET/release/tfm"
          stat -f 'size before stripping: %z bytes' "$binary"
          strip "$binary"
          stat -f 'size after stripping: %z bytes' "$binary"

      - name: Verify stripped Mach-O architecture
        if: matrix.kind == 'macos'
        env:
          EXPECTED_ARCH: ${{ matrix.macho_arch }}
        run: |
          description=$(file "target/$TARGET/release/tfm")
          grep -Eq "Mach-O 64-bit executable $EXPECTED_ARCH" <<<"$description" || {
            echo "error: stripped binary is no longer a $EXPECTED_ARCH Mach-O executable" >&2
            exit 1
          }

      # ----- Windows: native runner builds ---------------------------------

      - name: Install Rust toolchain (Windows)
        if: matrix.kind == 'windows'
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build release binary (Windows)
        if: matrix.kind == 'windows'
        run: cargo build --release --locked --target "$env:TARGET"

      - name: Verify PE architecture
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          & ./scripts/verify-release-binary.ps1 -Arch $env:EXPECTED_ARCH -Binary "target/$env:TARGET/release/tfm.exe"

      # ----- Shared: smoke test and packaging -------------------------------

      - name: Smoke-test version output (Unix)
        if: matrix.kind != 'windows'
        run: |
          output=$(eval '"target/$TARGET/release/tfm" --version')
          expected="tfm $CRATE_VERSION"
          if [ "$output" != "$expected" ]; then
            echo "error: expected '$expected', got '$output'" >&2
            exit 1
          fi

      - name: Smoke-test version output (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $output = & "target/$env:TARGET/release/tfm.exe" --version
          $expected = "tfm $env:CRATE_VERSION"
          if ($output -ne $expected) {
            Write-Error "expected '$expected', got '$output'"
            exit 1
          }

      - name: Package archive and checksum (Unix)
        if: matrix.kind != 'windows'
        run: |
          archive_root="$RUNNER_TEMP/tfm-release"
          mkdir -p "$archive_root"
          install -m 755 "target/$TARGET/release/tfm" "$archive_root/tfm"
          cp LICENSE-MIT LICENSE-APACHE README.md "$archive_root/"
          tar -czf "$ARCHIVE_NAME" -C "$archive_root" \
            tfm LICENSE-MIT LICENSE-APACHE README.md
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Package archive and checksum (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $archiveRoot = Join-Path $env:RUNNER_TEMP 'tfm-release'
          New-Item -ItemType Directory -Path $archiveRoot -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/tfm.exe" $archiveRoot
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md $archiveRoot
          Compress-Archive -Path (Join-Path $archiveRoot '*') -DestinationPath $env:ARCHIVE_NAME
          $hash = (Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE_NAME" | Set-Content -NoNewline "$env:ARCHIVE_NAME.sha256"

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify-assets:
    name: Verify complete rehearsal inventory
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ needs.prepare.outputs.release-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set
        run: |
          for entry in \
            x86_64-unknown-linux-gnu:tar.gz \
            x86_64-unknown-linux-musl:tar.gz \
            aarch64-unknown-linux-gnu:tar.gz \
            aarch64-unknown-linux-musl:tar.gz \
            x86_64-apple-darwin:tar.gz \
            aarch64-apple-darwin:tar.gz \
            x86_64-pc-windows-msvc:zip \
            aarch64-pc-windows-msvc:zip
          do
            target=${entry%%:*}
            extension=${entry#*:}
            archive="terminal-file-manager-$TAG_NAME-$target.$extension"
            test -s "dist/$archive" || {
              echo "error: missing or empty release asset: $archive" >&2
              exit 1
            }
            test -s "dist/$archive.sha256" || {
              echo "error: missing or empty checksum asset: $archive.sha256" >&2
              exit 1
            }
            (cd dist && sha256sum -c "$archive.sha256")
          done

      - name: Verify exact rehearsal asset inventory
        run: |
          expected="$RUNNER_TEMP/expected-assets"
          actual="$RUNNER_TEMP/actual-assets"
          for entry in \
            x86_64-unknown-linux-gnu:tar.gz \
            x86_64-unknown-linux-musl:tar.gz \
            aarch64-unknown-linux-gnu:tar.gz \
            aarch64-unknown-linux-musl:tar.gz \
            x86_64-apple-darwin:tar.gz \
            aarch64-apple-darwin:tar.gz \
            x86_64-pc-windows-msvc:zip \
            aarch64-pc-windows-msvc:zip
          do
            target=${entry%%:*}
            extension=${entry#*:}
            echo "terminal-file-manager-$TAG_NAME-$target.$extension"
            echo "terminal-file-manager-$TAG_NAME-$target.$extension.sha256"
          done | sort > "$expected"
          find dist -mindepth 1 -type f -printf "%P\n" | sort > "$actual"
          diff -u "$expected" "$actual"
          while IFS= read -r asset; do
            test -s "dist/$asset" || {
              echo "error: empty release asset: $asset" >&2
              exit 1
            }
          done < "$actual"

