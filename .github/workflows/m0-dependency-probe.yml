# Temporary M0 feasibility proof; remove after evidence acceptance.
name: M0 selected dependency probe
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/m0-dependency-probe.yml
      - probes/m0-dependencies/**
permissions: {}
concurrency:
  group: m0-dependencies-${{ github.ref }}
  cancel-in-progress: false
env:
  RUST_VERSION: 1.95.0
  RUSTUP_TOOLCHAIN: 1.95.0
  RUSTUP_VERSION: 1.29.1
  PROBE_MANIFEST: probes/m0-dependencies/Cargo.toml
  CARGO_TARGET_DIR: ${{ github.workspace }}/probe-output/target
  CC_ENABLE_DEBUG_OUTPUT: '1'
jobs:
  dependency:
    name: Dependency ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      LIBC: ${{ matrix.libc }}
      BUILD_IMAGE: ${{ matrix.image }}
      RUSTUP_INIT_SHA256: ${{ matrix.rustup_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            rustup_sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
            runner: ubuntu-24.04
            # quay.io/pypa/manylinux_2_28_x86_64:latest, resolved 2026-09-26.
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
            kind: linux
            libc: gnu
            arch: x86_64
          - target: x86_64-unknown-linux-musl
            rustup_sha256: 331228566cc931f32cd684f9bebc5956a5e5d7394c8d5de595f196a658ab98e6
            runner: ubuntu-24.04
            # quay.io/pypa/musllinux_1_2_x86_64:latest, resolved 2026-09-26.
            image: quay.io/pypa/musllinux_1_2_x86_64@sha256:bcd644f5f08de4c286b4e8a99652d106a7e56881d8e0b3f92d471f05f5b60fd3
            kind: linux
            libc: musl
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            rustup_sha256: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
            runner: ubuntu-24.04-arm
            # quay.io/pypa/manylinux_2_28_aarch64:latest, resolved 2026-09-26.
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:c22ffd129ac99a8a42d1f2c2f4e88a9089288dd9ee987a7092da1c7dc48f27a9
            kind: linux
            libc: gnu
            arch: aarch64
          - target: aarch64-unknown-linux-musl
            rustup_sha256: 1ddf36182ac5d1782dbeefcb9bea7f5f9412d88f4a0d5047b1564a223624e8c6
            runner: ubuntu-24.04-arm
            # quay.io/pypa/musllinux_1_2_aarch64:latest, resolved 2026-09-26.
            image: quay.io/pypa/musllinux_1_2_aarch64@sha256:fecc36f309839b485f04e36b6fd2272d98b84936e68122f3de9bd65c253e76dc
            kind: linux
            libc: musl
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            kind: macos
            arch: x86_64
            # `file` spells the architectures differently per platform.
            macho_arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-26
            kind: macos
            arch: aarch64
            macho_arch: arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            kind: windows
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            kind: windows
            arch: aarch64

    steps:
      - name: Preserve checkout bytes (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check frozen graph identity
        shell: pwsh
        run: |
          $hash = (Get-FileHash probes/m0-dependencies/Cargo.lock -Algorithm SHA256).Hash.ToLower()
          Write-Output "probe lockfile SHA256: $hash"
          if ($hash -ne 'd94748671869250b4b8468c9e96608893d61dbf6b109d9f832fc0f13d61ca7bd') {
            throw 'The reviewed probe graph changed; re-review dependency exceptions and evidence.'
          }
      - name: Controlled native Linux proof
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          mkdir -p probe-output
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$GITHUB_WORKSPACE/probe-output:/proof" \
            --workdir /work \
            --env RUST_VERSION --env RUSTUP_VERSION --env RUSTUP_INIT_SHA256 \
            --env TARGET --env LIBC --env ARCH --env CC_ENABLE_DEBUG_OUTPUT \
            "$BUILD_IMAGE" /bin/bash -ceu '
              set -euxo pipefail
              export RUSTUP_TOOLCHAIN="$RUST_VERSION"
              export CARGO_HOME=/proof/cargo
              export RUSTUP_HOME=/proof/rustup
              export CARGO_TARGET_DIR=/proof/target
              mkdir -p /proof/bootstrap
              rustup_init=/proof/bootstrap/rustup-init
              curl --proto '\''=https'\'' --tlsv1.2 -sSf --output "$rustup_init" "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$TARGET/rustup-init"
              printf '\''%s  %s\n'\'' "$RUSTUP_INIT_SHA256" "$rustup_init" | sha256sum -c -
              chmod 755 "$rustup_init"
              "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain "$RUST_VERSION"
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup component add clippy rust-docs
              rustup target add "$TARGET"
              rustc -vV
              cargo -vV
              uname -a
              cc --version
              ld --version
              as --version
              ldd --version || test "$LIBC" = musl
              printf '\''%s  %s\n'\'' d94748671869250b4b8468c9e96608893d61dbf6b109d9f832fc0f13d61ca7bd probes/m0-dependencies/Cargo.lock | sha256sum -c -
              manifest=probes/m0-dependencies/Cargo.toml
              cargo check --workspace --all-targets --all-features --locked --target "$TARGET" --manifest-path "$manifest"
              cargo clippy --workspace --all-targets --all-features --locked --target "$TARGET" --manifest-path "$manifest" -- -D warnings
              cargo test --workspace --all-targets --all-features --locked --target "$TARGET" --manifest-path "$manifest"
              cargo test --workspace --doc --all-features --locked --target "$TARGET" --manifest-path "$manifest"
              RUSTDOCFLAGS='\''-D warnings'\'' cargo doc --workspace --no-deps --all-features --locked --target "$TARGET" --manifest-path "$manifest"
              cargo build -vv --release --locked --target "$TARGET" --manifest-path "$manifest"
              binary="$CARGO_TARGET_DIR/$TARGET/release/tfm-m0-dependency-probe"
              sh scripts/verify-release-binary.sh "$LIBC" "$ARCH" "$binary"
              readelf -hW "$binary"
              readelf -dW "$binary"
              test "$(timeout 10 "$binary")" = '\''tfm M0 dependency probe: OK'\''
              stat -c '\''size before stripping: %s bytes'\'' "$binary"
              strip --strip-all "$binary"
              stat -c '\''size after stripping: %s bytes'\'' "$binary"
              if test "$LIBC" = musl; then verify_kind=static; else verify_kind=gnu; fi
              sh scripts/verify-release-binary.sh "$verify_kind" "$ARCH" "$binary"
              test "$(timeout 10 "$binary")" = '\''tfm M0 dependency probe: OK'\''
            ' 2>&1 | tee probe-output/native.txt
      - name: Install native Rust
        if: matrix.kind != 'linux'
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: ${{ matrix.target }}
      - name: Native macOS graph and object proof
        if: matrix.kind == 'macos'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.macho_arch }}
        run: |
          mkdir -p probe-output
          {
            rustc -vV
            cargo -vV
            sw_vers
            clang --version
            ld -version_details
            as --version
            xcrun --show-sdk-version
            xcrun --show-sdk-path
            cargo tree --workspace --locked -e features --target "$TARGET" --manifest-path "$PROBE_MANIFEST"
            cargo check --workspace --all-targets --all-features --locked --target "$TARGET" --manifest-path "$PROBE_MANIFEST"
            cargo clippy --workspace --all-targets --all-features --locked --target "$TARGET" --manifest-path "$PROBE_MANIFEST" -- -D warnings
            cargo test --workspace --all-targets --all-features --locked --target "$TARGET" --manifest-path "$PROBE_MANIFEST"
            cargo test --workspace --doc --all-features --locked --target "$TARGET" --manifest-path "$PROBE_MANIFEST"
            RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked --target "$TARGET" --manifest-path "$PROBE_MANIFEST"
            cargo build -vv --release --locked --target "$TARGET" --manifest-path "$PROBE_MANIFEST"
            binary="$CARGO_TARGET_DIR/$TARGET/release/tfm-m0-dependency-probe"
            file "$binary" | grep -E "Mach-O 64-bit executable $EXPECTED_ARCH"
            otool -L "$binary"
            otool -l "$binary"
            test "$("$binary")" = 'tfm M0 dependency probe: OK'
            stat -f 'size before stripping: %z bytes' "$binary"
            strip "$binary"
            stat -f 'size after stripping: %z bytes' "$binary"
            file "$binary" | grep -E "Mach-O 64-bit executable $EXPECTED_ARCH"
            otool -L "$binary"
            otool -l "$binary"
            test "$("$binary")" = 'tfm M0 dependency probe: OK'
          } 2>&1 | tee probe-output/native.txt
      - name: Native Windows graph and object proof
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force probe-output | Out-Null
          Start-Transcript -Path probe-output/native.txt
          try {
            rustc -vV
            cargo -vV
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $vs = & $vswhere -latest -products '*' -property installationPath
            if (-not $vs) { throw 'No native Visual Studio installation found' }
            $nativeArch = if ($env:ARCH -eq 'aarch64') { 'arm64' } else { 'x64' }
            $tools = Get-ChildItem "$vs/VC/Tools/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $compilerBin = "$($tools.FullName)/bin/Host$nativeArch/$nativeArch"
            Get-Item "$compilerBin/cl.exe", "$compilerBin/link.exe", "$compilerBin/lib.exe" | Select-Object FullName, VersionInfo
            Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/Lib" -Directory | Select-Object Name
            if ($nativeArch -eq 'arm64') { clang --version }
            cargo tree --workspace --locked -e features --target $env:TARGET --manifest-path $env:PROBE_MANIFEST
            cargo check --workspace --all-targets --all-features --locked --target $env:TARGET --manifest-path $env:PROBE_MANIFEST
            cargo clippy --workspace --all-targets --all-features --locked --target $env:TARGET --manifest-path $env:PROBE_MANIFEST -- -D warnings
            cargo test --workspace --all-targets --all-features --locked --target $env:TARGET --manifest-path $env:PROBE_MANIFEST
            cargo test --workspace --doc --all-features --locked --target $env:TARGET --manifest-path $env:PROBE_MANIFEST
            $env:RUSTDOCFLAGS = '-D warnings'
            cargo doc --workspace --no-deps --all-features --locked --target $env:TARGET --manifest-path $env:PROBE_MANIFEST
            cargo build -vv --release --locked --target $env:TARGET --manifest-path $env:PROBE_MANIFEST
            $binary = "$env:CARGO_TARGET_DIR/$env:TARGET/release/tfm-m0-dependency-probe.exe"
            & ./scripts/verify-release-binary.ps1 -Arch $env:ARCH -Binary $binary
            & "$compilerBin/dumpbin.exe" /headers /imports $binary
            $output = & $binary
            if ($output -ne 'tfm M0 dependency probe: OK') { throw 'Native dependency smoke failed' }
          } finally {
            Stop-Transcript
          }
      - name: Retain dependency evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m0-dependencies-${{ matrix.target }}
          retention-days: 7
          path: |
            probe-output/*.txt
            probe-output/target/${{ matrix.target }}/release/tfm-m0-dependency-probe
            probe-output/target/${{ matrix.target }}/release/tfm-m0-dependency-probe.exe
