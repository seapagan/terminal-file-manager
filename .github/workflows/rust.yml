name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.0

jobs:
  library:
    name: Native Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            coverage: linux
          - os: macos-15
            coverage: macos
          - os: windows-2025
            coverage: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install current stable Rust
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt clippy llvm-tools-preview
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install test tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-make@0.37.24, cargo-nextest@0.9.148, cargo-llvm-cov@0.9.1
      - name: Verify the executable and library
        run: |
          cargo make format
          cargo make check
          cargo make clippy
          cargo make doctest
          cargo make doc
          cargo make build
          cargo make package

      - name: Run native Rust tests with coverage
        env:
          COVERAGE_PLATFORM: ${{ matrix.coverage }}
        run: |
          cargo llvm-cov nextest \
            --all-targets --all-features --locked --no-fail-fast \
            --remap-path-prefix --lcov \
            --output-path="coverage-${COVERAGE_PLATFORM}.lcov"
          cargo llvm-cov report \
            --remap-path-prefix --json \
            --output-path="coverage-${COVERAGE_PLATFORM}.json"
          test -s "coverage-${COVERAGE_PLATFORM}.lcov"
          test -s "coverage-${COVERAGE_PLATFORM}.json"

      - name: Validate Unix coverage
        if: runner.os != 'Windows'
        env:
          COVERAGE_PLATFORM: ${{ matrix.coverage }}
        shell: bash
        run: |
          set -euo pipefail
          report="coverage-${COVERAGE_PLATFORM}.lcov"
          test -s "$report"
          awk '
            /^SF:/ {
              found = 1
              if ($0 !~ /^SF:src\/[A-Za-z0-9_.\/-]+$/) {
                print "Invalid LCOV source path: " $0 > "/dev/stderr"
                invalid = 1
              }
              if (seen[$0]++) {
                print "Duplicate LCOV source path: " $0 > "/dev/stderr"
                duplicate = 1
              }
            }
            END { exit !found || invalid || duplicate }
          ' "$report"

      - name: Normalize Windows coverage paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $coveragePath = (Resolve-Path coverage-windows.lcov).Path
          $coverageLines = [System.IO.File]::ReadAllLines($coveragePath)
          for ($index = 0; $index -lt $coverageLines.Length; $index++) {
            if ($coverageLines[$index].StartsWith('SF:')) {
              $coverageLines[$index] = $coverageLines[$index].Replace('\', '/')
            }
          }
          $coverageText = [string]::Join("`n", $coverageLines) + "`n"
          [System.IO.File]::WriteAllText(
            $coveragePath,
            $coverageText,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Validate Windows coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $coveragePath = (Resolve-Path coverage-windows.lcov).Path
          if ((Get-Item $coveragePath).Length -eq 0) {
            throw "The Windows coverage report is empty."
          }
          $sourcePaths = @(
            Select-String -Path $coveragePath -Pattern '^SF:' |
              ForEach-Object { $_.Line }
          )
          if ($sourcePaths.Count -eq 0) {
            throw "The Windows coverage report contains no source paths."
          }
          $invalidPaths = @(
            $sourcePaths |
              Where-Object { $_ -notmatch '^SF:src/[A-Za-z0-9_./-]+$' }
          )
          if ($invalidPaths.Count -gt 0) {
            $invalidPaths | ForEach-Object {
              Write-Error "Invalid LCOV source path: $_"
            }
            throw "The Windows coverage report has invalid source paths."
          }
          $duplicatePaths = @(
            $sourcePaths |
              Group-Object |
              Where-Object { $_.Count -gt 1 } |
              ForEach-Object { $_.Name }
          )
          if ($duplicatePaths.Count -gt 0) {
            $duplicatePaths | ForEach-Object {
              Write-Error "Duplicate LCOV source path: $_"
            }
            throw "The Windows coverage report has duplicate source paths."
          }

      - name: Upload native coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.coverage }}
          path: |
            coverage-${{ matrix.coverage }}.lcov
            coverage-${{ matrix.coverage }}.json
          if-no-files-found: error
          retention-days: 14

  msrv:
    name: Exact declared MSRV
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bootstrap Rust for manifest discovery
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install task runner
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-make@0.37.24
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: cargo make msrv-version
      - name: Install declared Rust
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: rustfmt clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ steps.msrv.outputs.version }}
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify the full MSRV compiler gate
        run: cargo make msrv

  quality:
    name: Source quality and script lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python for support tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Install Python support tools
        run: |
          python -m pip install 'lizard==1.23.0'
          lizard --version
      - name: Install current stable Rust
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
          shared-key: quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install quality tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-make@0.37.24
      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          version="0.11.0"
          archive="shellcheck-v${version}.linux.x86_64.tar.gz"
          install_dir="${RUNNER_TEMP:?}/shellcheck-${version}"
          archive_path="${RUNNER_TEMP:?}/${archive}"
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"

          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive_path" "$url"
          printf '%s  %s\n' \
            "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6" \
            "$archive_path" | sha256sum --check -
          tar -xzf "$archive_path" -C "$install_dir"
          shellcheck_dir="$install_dir/shellcheck-v${version}"
          echo "$shellcheck_dir" >> "${GITHUB_PATH:?}"
          "$shellcheck_dir/shellcheck" --version

      - name: Lint binary verification scripts
        run: cargo make release-shellcheck

      - name: Lint POSIX installer and regression harness
        run: cargo make installers-shellcheck

      - name: Analyse source complexity and maintainability
        run: |
          cargo make complexity
          cargo make maintainability

  coverage:
    name: Combined coverage
    runs-on: ubuntu-24.04
    needs: library

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Linux coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-linux
          path: coverage/linux

      - name: Download macOS coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-macos
          path: coverage/macos

      - name: Download Windows coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-windows
          path: coverage/windows

      - name: Install LCOV
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lcov=2.0-4ubuntu2
          lcov --version

      - name: Validate and merge native LLVM coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.merge_llvm_coverage \
            --input linux coverage/linux/coverage-linux.lcov coverage/linux/coverage-linux.json \
            --input macos coverage/macos/coverage-macos.lcov coverage/macos/coverage-macos.json \
            --input windows coverage/windows/coverage-windows.lcov coverage/windows/coverage-windows.json \
            --output coverage.lcov > coverage-summary.json
          cat coverage-summary.json

      - name: Validate combined coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage.lcov
          awk '
            /^SF:/ {
              found = 1
              if ($0 !~ /^SF:src\/[A-Za-z0-9_.\/-]+$/) {
                print "Invalid LCOV source path: " $0 > "/dev/stderr"
                invalid = 1
              }
              if (seen[$0]++) {
                print "Duplicate LCOV source path: " $0 > "/dev/stderr"
                duplicate = 1
              }
            }
            END { exit !found || invalid || duplicate }
          ' coverage.lcov
          grep -h '^SF:' coverage/{linux,macos,windows}/coverage-*.lcov | sort -u > expected-sources.txt
          grep '^SF:' coverage.lcov | sort > combined-sources.txt
          cmp expected-sources.txt combined-sources.txt
          lcov --summary coverage.lcov

      - name: Print combined coverage summary
        run: lcov --summary coverage.lcov

      - name: Upload combined coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-combined
          path: |
            coverage.lcov
            coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Check optional Codacy configuration
        id: codacy
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [[ -n "$CODACY_PROJECT_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped Codacy reporting
        if: steps.codacy.outputs.configured != 'true'
        run: |
          echo "Codacy reporting skipped: token absent or untrusted fork PR. Combined coverage was verified and uploaded."

      - name: Run Codacy coverage reporter
        if: steps.codacy.outputs.configured == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.lcov
