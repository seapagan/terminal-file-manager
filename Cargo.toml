[package]
name = "terminal-file-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "A terminal file manager with independent local panes"
readme = "README.md"
repository = "https://github.com/seapagan/terminal-file-manager"
license = "MIT OR Apache-2.0"
keywords = ["cli", "file-manager", "terminal"]
categories = ["command-line-utilities"]
include = [
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
  "src/**",
  "tests/*.rs",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/terminal-file-manager-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "tfm"
path = "src/main.rs"

[dependencies]
colored_text = "=0.6.0"
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
ignore = "=0.4.33"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "display"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread"] }
time = { version = "=0.3.55", default-features = false, features = ["std"] }
vsort = "=0.2.0"

tempfile = "=3.27.0"
sha2 = "=0.11.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify = "=8.2.0"

# Level-triggered Unix input preserves pending keys when resize and input coincide.
[target.'cfg(unix)'.dependencies]
# Account lookups use the current Unix API; portable-pty retains its dev-only version.
nix = { version = "=0.31.3", default-features = false, features = ["user"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
windows = { version = "=0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
# The COM implementation macro requires its matching runtime crate by name.
windows-core = "=0.62.2"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
portable-pty = "=0.9.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
