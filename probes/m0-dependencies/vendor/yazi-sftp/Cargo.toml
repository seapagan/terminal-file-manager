[package]
name = "yazi-sftp"
description = "Yazi SFTP client (isolated TFM M0 snapshot)"
authors = ["AspectUnk", "sxyazi <sxyazi@gmail.com>"]
version = "26.9.1"
edition = "2024"
license = "MIT"
homepage = "https://yazi-rs.github.io"
repository = "https://github.com/sxyazi/yazi"
rust-version = "1.95.0"
publish = false

[dependencies]
bitflags = { version = "=2.13.2", features = ["serde"] }
hashbrown = { version = "=0.17.1", features = ["serde"] }
parking_lot = "=0.12.5"
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros"] }
typed-path = "=0.12.3"

[lints.clippy]
format_push_string = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
len_without_is_empty = "allow"
missing_safety_doc = "allow"
module_inception = "allow"
option_map_unit_fn = "allow"
unit_arg = "allow"
use_self = "warn"
