[package]
name = "tfm-m0-dependency-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["vendor/yazi-sftp"]
resolver = "3"

[dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
yazi-sftp = { path = "vendor/yazi-sftp", version = "=26.9.1" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros"] }
ring = "=0.17.14"

[lints.rust]
unsafe_code = "deny"
