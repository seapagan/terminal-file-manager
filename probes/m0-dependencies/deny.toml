[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Zlib", "Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Approved only for this frozen probe lockfile; re-review any lockfile change.
# Disjoint upstream ranges and reverse paths: evidence/duplicate-paths.json.
skip = [
    { name = "getrandom", version = "=0.2.17" }, # ring ^0.2 vs russh ^0.4
    { name = "hashbrown", version = "=0.16.1" }, # kasuari ^0.16 vs Ratatui/Yazi ^0.17
    { name = "sha3", version = "=0.11.0" }, # ml-kem ^0.11 vs russh ^0.12
    { name = "syn", version = "=2.0.119" }, # derive macros require disjoint ^2/^3
    { name = "windows-sys", version = "=0.52.0" }, # ring ^0.52 vs mio/Tokio ^0.61
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
